stages:
  - build
  - release
  - sync

variables:
  ELECTRON_CACHE: "${CI_PROJECT_DIR}/ui/.cache/electron"
  ELECTRON_BUILDER_CACHE: "${CI_PROJECT_DIR}/ui/.cache/electron-builder"
  npm_config_cache: "${CI_PROJECT_DIR}/ui/.npm"

# Глобальный кэш для ускорения сборок
cache:
  key:
    files:
      - ui/package-lock.json
  paths:
    - ui/node_modules/
    - ui/.npm/
    - ui/.cache/electron/
    - ui/.cache/electron-builder/
    - .apt-cache/

build:linux_win:
  stage: build
  image: electronuserland/builder:wine
  script:
    - mkdir -p .apt-cache/archives/partial
    - apt-get update -o dir::cache::archives=".apt-cache/archives"
    - apt-get install -o dir::cache::archives=".apt-cache/archives" -y mingw-w64 g++
    - x86_64-w64-mingw32-g++ ui/native/morze_engine_v2.cpp -I ui/native -o ui/native/morze_app.exe -static -lpthread -lm
    - g++ ui/native/morze_engine_v2.cpp -I ui/native -o ui/native/morze_app -lpthread -lm -ldl
    - cd ui
    - npm install
    - npm run build
    - npx electron-builder --linux --win -p never
  artifacts:
    name: "paloma-morse-$CI_COMMIT_TAG-linux-win"
    paths:
      - ui/native/morze_app
      - ui/native/morze_app.exe
      - ui/release/*.AppImage
      - ui/release/*.exe
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

build:mac:
  stage: build
  tags:
    - mac-runner
  script:
    - cd ui
    - g++ native/morze_engine_v2.cpp -I native -o native/morze_app -lpthread -lm -ldl -framework CoreAudio -framework AudioUnit -framework CoreFoundation
    - npm install
    - npm run build
    - npx electron-builder --mac -p never
  artifacts:
    name: "paloma-morse-$CI_COMMIT_TAG-mac"
    paths:
      - ui/native/morze_app
      - ui/release/*.dmg
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  cache: []
  needs:
    - job: build:linux_win
      artifacts: true
    - job: build:mac
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Publishing release $CI_COMMIT_TAG"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Automatic build for Paloma Morse engine.'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'Windows Setup (.exe)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/release/Paloma-Morse%20Setup%20${CI_COMMIT_TAG}.exe?job=build:linux_win'
        - name: 'Linux Portable (.AppImage)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/release/Paloma-Morse-${CI_COMMIT_TAG}.AppImage?job=build:linux_win'
        - name: 'macOS Disk Image (.dmg)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/release/Paloma-Morse-${CI_COMMIT_TAG}-arm64.dmg?job=build:mac'
        - name: 'Engine Console Windows (.exe)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/native/morze_app.exe?job=build:linux_win'
        - name: 'Engine Console Linux (ELF)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/native/morze_app?job=build:linux_win'
        - name: 'Engine Console macOS (ARM64)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/native/morze_app?job=build:mac'

sync:github:
  stage: sync
  image: alpine:latest
  needs:
    - job: build:linux_win
      artifacts: true
    - job: build:mac
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl git
  script:
    - echo "Syncing release $CI_COMMIT_TAG to GitHub"
    - git remote add github https://x-access-token:${GITHUB_TOKEN}@github.com/sk1bid/Paloma-Morze.git
    - git push github $CI_COMMIT_TAG
    - |
      # Create GitHub Release
      RELEASE_RESPONSE=$(curl -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github.v3+json" \
        https://api.github.com/repos/sk1bid/Paloma-Morze/releases \
        -d "{\"tag_name\":\"${CI_COMMIT_TAG}\",\"name\":\"Release ${CI_COMMIT_TAG}\",\"body\":\"Automatic release mirrored from GitLab CI.\"}")
      
      UPLOAD_URL=$(echo "$RELEASE_RESPONSE" | grep -o 'upload_url": "[^"]*' | cut -d'"' -f3 | sed 's/{?name,label}//')
      
      if [ -z "$UPLOAD_URL" ]; then
        echo "Error: Could not get upload_url from GitHub. Response was:"
        echo "$RELEASE_RESPONSE"
        exit 1
      fi
      
      # Function to upload asset
      upload_asset() {
        FILE_PATH=$1
        FILE_NAME=$(basename "$FILE_PATH")
        echo "Uploading $FILE_NAME to GitHub..."
        curl -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
          -H "Content-Type: application/octet-stream" \
          --data-binary "@$FILE_PATH" \
          "$UPLOAD_URL?name=$FILE_NAME"
      }
      
      # Find and upload files
      for f in ui/release/*.dmg ui/release/*.exe ui/release/*.AppImage ui/native/morze_app ui/native/morze_app.exe; do
        if [ -f "$f" ]; then
          upload_asset "$f"
        else
          echo "Warning: File $f not found, skipping."
        fi
      done
