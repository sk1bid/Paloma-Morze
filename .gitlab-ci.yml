stages:
  - build
  - release

variables:
  ELECTRON_CACHE: "${CI_PROJECT_DIR}/ui/.cache/electron"
  npm_config_cache: "${CI_PROJECT_DIR}/ui/.npm"

# Глобальный кэш для ускорения сборок
cache:
  key:
    files:
      - ui/package-lock.json
  paths:
    - ui/node_modules/
    - ui/.npm/
    - ui/.cache/electron/

build:linux_win:
  stage: build
  image: electronuserland/builder:wine
  script:
    - cd ui
    - npm install
    - npm run build
    - npx electron-builder --linux --win -p never
  artifacts:
    name: "paloma-morse-$CI_COMMIT_TAG-linux-win"
    paths:
      - ui/release/*.AppImage
      - ui/release/*.exe
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

build:mac:
  stage: build
  tags:
    - mac-runner
  script:
    - cd ui
    - npm install
    - npm run build
    - npx electron-builder --mac -p never
  artifacts:
    name: "paloma-morse-$CI_COMMIT_TAG-mac"
    paths:
      - ui/release/*.dmg
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build:linux_win
      artifacts: true
    - job: build:mac
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Publishing release $CI_COMMIT_TAG"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Automatic build for Paloma Morse engine.'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'Windows Setup (.exe)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/release/Paloma%20Morse%20Setup%20${CI_COMMIT_TAG}.exe?job=build:linux_win'
        - name: 'Linux Portable (.AppImage)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/release/Paloma%20Morse-${CI_COMMIT_TAG}.AppImage?job=build:linux_win'
        - name: 'macOS Disk Image (.dmg)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/release/Paloma%20Morse-${CI_COMMIT_TAG}-arm64.dmg?job=build:mac'
