stages:
  - build
  - release
  - sync

variables:
  ELECTRON_CACHE: "${CI_PROJECT_DIR}/ui/.cache/electron"
  ELECTRON_BUILDER_CACHE: "${CI_PROJECT_DIR}/ui/.cache/electron-builder"
  npm_config_cache: "${CI_PROJECT_DIR}/ui/.npm"

# Глобальный кэш для ускорения сборок
cache:
  key:
    files:
      - ui/package-lock.json
  paths:
    - ui/node_modules/
    - ui/.npm/
    - ui/.cache/electron/
    - ui/.cache/electron-builder/
    - .apt-cache/

build:linux_win:
  stage: build
  image: electronuserland/builder:wine
  script:
    - mkdir -p .apt-cache/archives/partial
    - apt-get update -o dir::cache::archives=".apt-cache/archives"
    - apt-get install -o dir::cache::archives=".apt-cache/archives" -y mingw-w64 g++
    - x86_64-w64-mingw32-g++ ui/native/morze_engine_v2.cpp -I ui/native -o ui/native/morze_app_win.exe -static -lpthread -lm
    - g++ ui/native/morze_engine_v2.cpp -I ui/native -o ui/native/morze_app_linux -lpthread -lm -ldl
    - cd ui
    - npm install
    - npm run build
    - npx electron-builder --linux --win -p never
  artifacts:
    name: "paloma-morse-$CI_COMMIT_TAG-linux-win"
    paths:
      - ui/native/morze_app_linux
      - ui/native/morze_app_win.exe
      - ui/release/*.AppImage
      - ui/release/*.exe
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

build:mac:
  stage: build
  tags:
    - mac-runner
  script:
    - cd ui
    - g++ native/morze_engine_v2.cpp -I native -o native/morze_app_macos -lpthread -lm -ldl -framework CoreAudio -framework AudioUnit -framework CoreFoundation
    - npm install
    - npm run build
    - npx electron-builder --mac -p never
  artifacts:
    name: "paloma-morse-$CI_COMMIT_TAG-mac"
    paths:
      - ui/native/morze_app_macos
      - ui/release/*.dmg
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  cache: []
  needs:
    - job: build:linux_win
      artifacts: true
    - job: build:mac
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Publishing release $CI_COMMIT_TAG"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Automatic build for Paloma Morse engine.'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'Windows Setup (.exe)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/release/Paloma-Morse%20Setup%20${CI_COMMIT_TAG}.exe?job=build:linux_win'
        - name: 'Linux Portable (.AppImage)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/release/Paloma-Morse-${CI_COMMIT_TAG}.AppImage?job=build:linux_win'
        - name: 'macOS Disk Image (.dmg)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/release/Paloma-Morse-${CI_COMMIT_TAG}-arm64.dmg?job=build:mac'
        - name: 'Engine Console Windows (.exe)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/native/morze_app_win.exe?job=build:linux_win'
        - name: 'Engine Console Linux (ELF)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/native/morze_app_linux?job=build:linux_win'
        - name: 'Engine Console macOS (ARM64)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/native/morze_app_macos?job=build:mac'

sync:github:
  stage: sync
  variables:
    GIT_DEPTH: 1
  image: alpine:latest
  needs: [] 
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl git
  script:
    - |
      echo "Syncing CLEAN state (README only) to GitHub"
      mkdir clean_mirror
      cp README.md clean_mirror/
      cd clean_mirror
      git init
      git config user.email "ci-bot@paloma-morse.app"
      git config user.name "Paloma CI Bot"
      git add README.md
      git commit -m "Mirror state for $CI_COMMIT_TAG"
      git remote add github https://x-access-token:${GITHUB_TOKEN}@github.com/sk1bid/Paloma-Morze.git
      git push github master:main --force
      
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Pushing tag $CI_COMMIT_TAG to GitHub"
        git tag $CI_COMMIT_TAG
        git push github $CI_COMMIT_TAG --force
      fi

sync:github_assets:
  stage: sync
  image: alpine:latest
  needs:
    - job: build:linux_win
      artifacts: true
    - job: build:mac
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      echo "Uploading assets for $CI_COMMIT_TAG to GitHub"
      VERSION="$CI_COMMIT_TAG"
      
      # 1. Get or Create Release
      RELEASE_RESPONSE=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
        https://api.github.com/repos/sk1bid/Paloma-Morze/releases/tags/${VERSION})
      
      RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id')
      if [ "$RELEASE_ID" = "null" ]; then
        RELEASE_RESPONSE=$(curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/sk1bid/Paloma-Morze/releases \
          -d "{\"tag_name\":\"${VERSION}\",\"name\":\"Release ${VERSION}\",\"body\":\"Automatic release mirrored from GitLab CI.\"}")
        RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id')
      fi
      
      UPLOAD_URL=$(echo "$RELEASE_RESPONSE" | jq -r '.upload_url' | sed 's/{?name,label}//')
      
      # 2. Upload function with name mapping
      upload_asset() {
        FILE_PATH=$1
        FILE_NAME=$(basename "$FILE_PATH")
        
        # Mapping logic
        case "$FILE_NAME" in
          *.dmg)               DISPLAY_NAME="Paloma-Morse-v${VERSION}-macOS-arm64.dmg" ;;
          *Setup*.exe)         DISPLAY_NAME="Paloma-Morse-v${VERSION}-Windows-Setup.exe" ;;
          *.AppImage)          DISPLAY_NAME="Paloma-Morse-v${VERSION}-Linux-x64.AppImage" ;;
          morze_app_linux)     DISPLAY_NAME="Paloma-Engine-Console-v${VERSION}-Linux-x64" ;;
          morze_app_macos)     DISPLAY_NAME="Paloma-Engine-Console-v${VERSION}-macOS-arm64" ;;
          morze_app_win.exe)   DISPLAY_NAME="Paloma-Engine-Console-v${VERSION}-Windows-x64.exe" ;;
          *)                   DISPLAY_NAME="$FILE_NAME" ;;
        esac
        
        ENCODED_NAME=$(echo "$DISPLAY_NAME" | sed 's/ /%20/g')
        echo "Uploading $FILE_NAME as $DISPLAY_NAME..."
        
        UPLOAD_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
          -H "Content-Type: application/octet-stream" \
          --data-binary "@$FILE_PATH" \
          "${UPLOAD_URL}?name=${ENCODED_NAME}")
        
        [ "$UPLOAD_STATUS" -eq 201 ] && echo "Successfully uploaded $DISPLAY_NAME" || echo "Failed $DISPLAY_NAME (HTTP $UPLOAD_STATUS)"
      }
      
      # 3. Process files
      find ui/release ui/native -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "morze_app_linux" -o -name "morze_app_macos" -o -name "morze_app_win.exe" \) | while read f; do
        upload_asset "$f"
      done
