stages:
  - test
  - build
  - test_release
  - release
  - sync

variables:
  ELECTRON_CACHE: "${CI_PROJECT_DIR}/ui/.cache/electron"
  ELECTRON_BUILDER_CACHE: "${CI_PROJECT_DIR}/ui/.cache/electron-builder"
  npm_config_cache: "${CI_PROJECT_DIR}/ui/.npm"

# Глобальная конфигурация кэша
.npm_cache_config: &npm_cache_config
  key:
    files:
      - ui/package-lock.json
  paths:
    - ui/node_modules/
    - ui/.npm/
  policy: pull-push

.electron_cache_config: &electron_cache_config
  key: "electron-cache-$CI_COMMIT_REF_SLUG"
  paths:
    - ui/.cache/electron/
    - ui/.cache/electron-builder/
  policy: pull-push

test:cpp_parser:
  stage: test
  image: gcc:latest
  script:
    - g++ ui/native/test_parser.cpp -I ui/native -o test_parser
    - ./test_parser

test:bridge:
  stage: test
  image: node:20
  script:
    - cd ui
    - npm ci --cache .npm --prefer-offline
    - npm test
  cache:
    <<: *npm_cache_config
    policy: pull

build:linux_win:
  stage: build
  image: electronuserland/builder:wine
  script:
    - |
      if [ -d ".apt-cache" ]; then
        cp -r .apt-cache/* /var/cache/apt/archives/ || true
      fi
    - apt-get update
    - apt-get install -y mingw-w64 g++
    - mkdir -p .apt-cache
    - cp /var/cache/apt/archives/*.deb .apt-cache/ || true
    - x86_64-w64-mingw32-g++ ui/native/morze_engine_v2.cpp -I ui/native -o ui/native/morze_app.exe -static -lpthread -lm
    - g++ ui/native/morze_engine_v2.cpp -I ui/native -o ui/native/morze_app -lpthread -lm -ldl
    - cp ui/native/morze_app ui/native/morze_app_linux
    - cp ui/native/morze_app.exe ui/native/morze_app_win.exe
    - cd ui
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - GH_TOKEN=$GITHUB_TOKEN npx electron-builder --linux --win -p always
  cache:
    - <<: *npm_cache_config
    - <<: *electron_cache_config
    - key: apt-cache-wine
      paths:
        - .apt-cache/
  artifacts:
    name: "paloma-morse-$CI_COMMIT_TAG-linux-win"
    paths:
      - ui/native/morze_app_linux
      - ui/native/morze_app_win.exe
      - ui/release/*.AppImage
      - ui/release/*.exe
      - ui/release/*.yml
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

build:mac:
  stage: build
  tags:
    - mac-runner
  script:
    - cd ui
    - g++ native/morze_engine_v2.cpp -I native -o native/morze_app -lpthread -lm -ldl -framework CoreAudio -framework AudioUnit -framework CoreFoundation
    - cp native/morze_app native/morze_app_macos
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - GH_TOKEN=$GITHUB_TOKEN npx electron-builder --mac -p always
  cache:
    - <<: *npm_cache_config
    - <<: *electron_cache_config
  artifacts:
    name: "paloma-morse-$CI_COMMIT_TAG-mac"
    paths:
      - ui/native/morze_app_macos
      - ui/release/*.dmg
      - ui/release/*.zip
      - ui/release/*.yml
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  cache: []
  needs:
    - job: build:linux_win
      artifacts: true
    - job: build:mac
      artifacts: true
    - job: test:release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Publishing release $CI_COMMIT_TAG"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Automatic build for Paloma Morse engine.'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'Windows Setup (.exe)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/release/Paloma-Morse.Setup.${CI_COMMIT_TAG}.exe?job=build:linux_win'
        - name: 'Linux Portable (.AppImage)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/release/Paloma-Morse.${CI_COMMIT_TAG}.AppImage?job=build:linux_win'
        - name: 'macOS Disk Image (.dmg)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/release/Paloma-Morse.${CI_COMMIT_TAG}.dmg?job=build:mac'
        - name: 'Engine Console Windows (.exe)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/native/morze_app_win.exe?job=build:linux_win'
        - name: 'Engine Console Linux (ELF)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/native/morze_app_linux?job=build:linux_win'
        - name: 'Engine Console macOS (ARM64)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/ui/native/morze_app_macos?job=build:mac'

test:release:
  stage: test_release
  image: node:20
  needs:
    - job: build:linux_win
      artifacts: true
    - job: build:mac
      artifacts: true
  script:
    - cd ui
    - npm install
    - node tests/verify_release.cjs
  rules:
    - if: $CI_COMMIT_TAG

sync:github:
  stage: sync
  variables:
    GIT_DEPTH: 1
  image: alpine:latest
  needs:
    - job: test:cpp_parser
    - job: test:bridge
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl git
  script:
    - |
      echo "Syncing CLEAN state (README only) to GitHub"
      mkdir clean_mirror
      cp README.md clean_mirror/
      cd clean_mirror
      git init
      git config user.email "ci-bot@paloma-morse.app"
      git config user.name "Paloma CI Bot"
      git add README.md
      git commit -m "Mirror state for $CI_COMMIT_TAG"
      git remote add github https://x-access-token:${GITHUB_TOKEN}@github.com/sk1bid/Paloma-Morze.git
      git push github master:main --force

sync:github_assets:
  stage: sync
  image: alpine:latest
  needs:
    - job: build:linux_win
      artifacts: true
    - job: build:mac
      artifacts: true
    - job: test:release
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      echo "Uploading assets for $CI_COMMIT_TAG to GitHub"
      VERSION="$CI_COMMIT_TAG"
      
      # 1. Get or Create Release
      RELEASE_RESPONSE=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
        https://api.github.com/repos/sk1bid/Paloma-Morze/releases/tags/${VERSION})
      
      RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id')
      if [ "$RELEASE_ID" = "null" ]; then
        RELEASE_RESPONSE=$(curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/sk1bid/Paloma-Morze/releases \
          -d "{\"tag_name\":\"${VERSION}\",\"name\":\"Release ${VERSION}\",\"body\":\"Automatic release mirrored from GitLab CI.\",\"draft\":false}")
        RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id')
      fi
      
      UPLOAD_URL=$(echo "$RELEASE_RESPONSE" | jq -r '.upload_url' | sed 's/{?name,label}//')
      
      # 2. Upload function with name mapping
      upload_asset() {
        FILE_PATH=$1
        FILE_NAME=$(basename "$FILE_PATH")
        
        # Use original names to avoid breaking links in latest.yml
        DISPLAY_NAME="$FILE_NAME"

        
        ENCODED_NAME=$(echo "$DISPLAY_NAME" | sed 's/ /%20/g')
        echo "Uploading $FILE_NAME as $DISPLAY_NAME..."
        
        UPLOAD_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
          -H "Content-Type: application/octet-stream" \
          --data-binary "@$FILE_PATH" \
          "${UPLOAD_URL}?name=${ENCODED_NAME}")
        
        [ "$UPLOAD_STATUS" -eq 201 ] && echo "Successfully uploaded $DISPLAY_NAME" || echo "Failed $DISPLAY_NAME (HTTP $UPLOAD_STATUS)"
      }
      
      # 3. Process files
      find ui/release ui/native -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.yml" -o -name "*.blockmap" -o -name "morze_app_linux" -o -name "morze_app_macos" -o -name "morze_app_win.exe" \) | while read f; do
        upload_asset "$f"
      done
