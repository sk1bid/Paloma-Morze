name: Native macOS CI
on:
  push:
    branches: ['integration/**']
  workflow_call:
  workflow_dispatch:
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    name: Swift + C++ (macOS 26)
    # Only the owner's selected branch uses the home runner. PRs stay hosted.
    runs-on: ${{ github.repository == 'sk1bid/Paloma-Morze' && github.actor == 'sk1bid' && github.ref == 'refs/heads/integration/macos-native' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && fromJSON('["self-hosted","macOS","ARM64","paloma-mac-mini"]') || 'macos-26' }}
    timeout-minutes: 35
    env:
      PALOMA_BUILD_JOBS: '2'
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Select Xcode and verify home runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            [[ "$(uname -m)" == arm64 ]]
            [[ "$(id -u)" != 0 ]]
            developer=/Applications/Xcode.app/Contents/Developer
          else
            developer=/Applications/Xcode_26.6.app/Contents/Developer
          fi
          [[ -d "$developer" ]]
          echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/macos/Tools/relay-fixture/package-lock.json
      - name: Toolchain and locked versions
        run: |
          xcodebuild -version
          python3 apps/macos/Tools/check-versions.py
      - name: Release metadata regression tests
        run: python3 -m unittest discover -s apps/macos/Tools/tests -v
      - name: Swift, native helper, relay and PCM regression tests
        env:
          NATIVE_TEST_DIR: ${{ runner.temp }}/native-tests
        run: bash apps/macos/Tools/ci-test.sh
      - name: Build distributable preview without production secrets
        env:
          NATIVE_BUILD_DIR: ${{ runner.temp }}/native-preview
          NATIVE_OUTPUT_DIR: ${{ runner.temp }}/native-artifacts
        run: bash apps/macos/Tools/ci-diagnostics.sh "$RUNNER_TEMP/native-preview/package.log" /bin/bash apps/macos/Tools/build-release.sh
      - name: Signed update round-trip and corruption rejection
        run: bash apps/macos/Tools/ci-diagnostics.sh "$RUNNER_TEMP/native-preview/update.log" /bin/bash apps/macos/Tools/test-update.sh
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-test-results
          path: |
            ${{ runner.temp }}/native-tests/Tests.xcresult
            ${{ runner.temp }}/native-tests/*.log
            ${{ runner.temp }}/native-preview/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Native preview packages (not an update channel)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-macos-preview
          path: ${{ runner.temp }}/native-artifacts/*
          if-no-files-found: error
          retention-days: 7
