name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-native:
    name: Native C++ Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and run test_parser
        run: |
          g++ ui/native/test_parser.cpp -I ui/native -o test_parser
          ./test_parser

  test-frontend:
    name: UI & Bridge Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Run tests
        working-directory: ui
        run: npm test
