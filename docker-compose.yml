version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: paloma
      POSTGRES_PASSWORD: paloma_password
      POSTGRES_DB: paloma_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: ./server
    restart: always
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://paloma:paloma_password@db:5432/paloma_db?schema=public
      JWT_SECRET: your_very_secret_key_here
      PORT: 3001
    depends_on:
      - db

volumes:
  pgdata:
